<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Um site de fã cinematográfico e informativo sobre Off-Campus, os livros de Elle Kennedy e sua adaptação para televisão."
  >

  <title>OFF-CAMPUS — Entre o amor e o gelo</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700;800&display=swap');

    :root {
      --bg: #05070c;
      --bg-2: #08111d;
      --navy: #0b1830;
      --blue: #173c68;
      --blue-bright: #2d628f;
      --wine: #5b1827;
      --wine-bright: #8c2b3d;
      --gold: #c7a76a;
      --cream: #eee9df;
      --white: #f7f7f5;
      --muted: #a8afb9;
      --line: rgba(255,255,255,.10);
      --shadow: 0 25px 80px rgba(0,0,0,.42);
      --radius: 22px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background:
        radial-gradient(
          circle at 15% 20%,
          rgba(23,60,104,.16),
          transparent 28%
        ),
        radial-gradient(
          circle at 85% 50%,
          rgba(91,24,39,.13),
          transparent 30%
        ),
        var(--bg);

      color: var(--white);
      font-family: "DM Sans", system-ui, sans-serif;
      line-height: 1.65;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 50;

      background-image:
        linear-gradient(
          rgba(255,255,255,.015) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255,255,255,.015) 1px,
          transparent 1px
        );

      background-size: 80px 80px;

      mask-image:
        linear-gradient(
          to bottom,
          black,
          transparent 90%
        );
    }

    img {
      display: block;
      width: 100%;
      max-width: 100%;
      object-fit: cover;
    }

    .section {
      position: relative;
      width: min(1240px, calc(100% - 48px));
      margin: 0 auto;
      padding: 110px 0;
    }

    .eyebrow {
      color: var(--gold);
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .24em;
      text-transform: uppercase;
      margin-bottom: 15px;
    }

    h1,
    h2,
    h3,
    .display {
      font-family: "Playfair Display", Georgia, serif;
      line-height: 1.04;
      margin: 0;
    }

    h2 {
      font-size: clamp(2.4rem, 5vw, 4.8rem);
      max-width: 820px;
    }

    .section-heading {
      margin-bottom: 55px;
    }

    .section-heading p {
      color: var(--muted);
      max-width: 680px;
      margin: 22px 0 0;
      font-size: 1.04rem;
    }

    /* =========================================================
       HERO
    ========================================================= */

    .hero {
      min-height: 100svh;
      position: relative;

      display: flex;
      align-items: flex-end;

      isolation: isolate;

      background:
        linear-gradient(
          90deg,
          rgba(3,5,9,.96) 0%,
          rgba(3,5,9,.72) 35%,
          rgba(3,5,9,.18) 72%,
          rgba(3,5,9,.58) 100%
        ),
        linear-gradient(
          0deg,
          rgba(3,5,9,1) 0%,
          rgba(3,5,9,.12) 46%,
          rgba(3,5,9,.35) 100%
        ),
        url("https://static.independent.co.uk/2026/05/13/17/_Off_Campus__Portrait_Session_12445.jpg?fit=crop&height=1200&width=1200")
        center/cover;

      overflow: hidden;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;

      background:
        radial-gradient(
          circle at 72% 30%,
          rgba(41,83,126,.20),
          transparent 28%
        ),
        linear-gradient(
          135deg,
          transparent 55%,
          rgba(110,22,44,.18)
        );

      z-index: -1;

      animation:
        atmosphere 9s ease-in-out infinite alternate;
    }

    .hero-content {
      width: min(1240px, calc(100% - 48px));
      margin: 0 auto;

      padding: 0 0 12vh;

      position: relative;
      z-index: 2;
    }

    .hero-kicker {
      display: inline-flex;
      align-items: center;
      gap: 10px;

      color: #ddd6c7;

      font-size: .78rem;
      letter-spacing: .28em;
      text-transform: uppercase;
      font-weight: 700;

      margin-bottom: 22px;
    }

    .hero-kicker::before {
      content: "";

      width: 38px;
      height: 1px;

      background: var(--gold);
    }

    .hero h1 {
      font-size: clamp(4.8rem, 13vw, 11.5rem);
      letter-spacing: -.055em;

      max-width: 1000px;

      text-shadow:
        0 15px 50px rgba(0,0,0,.45);
    }

    .hero-tagline {
      font-family: "Playfair Display", Georgia, serif;

      font-size: clamp(1.25rem, 2.2vw, 2rem);

      color: #f1eee9;

      max-width: 700px;

      margin: 22px 0 18px;
    }

    .hero-copy {
      max-width: 670px;

      color: #c7cbd1;

      font-size: 1rem;
    }

    .scroll-mark {
      position: absolute;

      left: 50%;
      bottom: 28px;

      transform: translateX(-50%);

      width: 1px;
      height: 65px;

      background:
        linear-gradient(
          to bottom,
          transparent,
          var(--gold)
        );

      opacity: .8;

      animation:
        breathe 2.2s ease-in-out infinite;
    }

    .scroll-mark::after {
      content: "EXPLORE";

      position: absolute;

      bottom: -4px;
      left: 50%;

      transform:
        translate(-50%, 100%)
        rotate(-90deg);

      transform-origin: center;

      color: #aaa;

      font-size: .55rem;

      letter-spacing: .28em;

      white-space: nowrap;
    }

    /* =========================================================
       SOBRE
    ========================================================= */

    .about-grid {
      display: grid;

      grid-template-columns:
        1.05fr
        .95fr;

      gap: 70px;

      align-items: center;
    }

    .about-copy {
      color: #c0c5cd;

      font-size: 1.02rem;
    }

    .about-copy p {
      margin: 0 0 20px;
    }

    .about-art {
      position: relative;

      min-height: 570px;

      border-radius: 28px;

      overflow: hidden;

      box-shadow: var(--shadow);

      background:
        linear-gradient(
          180deg,
          transparent,
          rgba(0,0,0,.8)
        ),
        url("https://media-assets.vanityfair.it/photos/6a7dd5e64dfe6a3f5abfd3cf/master/w_3940%2Cc_limit/Prime%2520Video_Off%2520Campus_7.jpg")
        center/cover;
    }

    .about-art::before {
      content: "BRIAR UNIVERSITY";

      position: absolute;

      left: 26px;
      bottom: 25px;

      color: rgba(255,255,255,.86);

      font-family:
        "Playfair Display",
        Georgia,
        serif;

      font-size: 1.7rem;

      letter-spacing: .08em;
    }

    .about-art::after {
      content: "";

      position: absolute;
      inset: 0;

      border:
        1px solid
        rgba(255,255,255,.12);

      border-radius: inherit;
    }

    /* =========================================================
       LIVROS
    ========================================================= */

    .books {
      background:
        linear-gradient(
          180deg,
          transparent,
          rgba(23,60,104,.06),
          transparent
        );
    }

    .book-grid {
      display: grid;

      grid-template-columns:
        repeat(5, 1fr);

      gap: 18px;
    }

    .book-card {
      position: relative;

      overflow: hidden;

      background: #0b0e15;

      border:
        1px solid
        var(--line);

      border-radius: 18px;

      min-width: 0;

      box-shadow:
        0 18px 45px
        rgba(0,0,0,.22);

      transition:
        transform .5s ease,
        border-color .5s ease,
        box-shadow .5s ease;
    }

    .book-card:hover {
      transform: translateY(-7px);

      border-color:
        rgba(199,167,106,.38);

      box-shadow:
        0 28px 65px
        rgba(0,0,0,.35);
    }

    .book-cover {
      aspect-ratio: 2 / 3;

      overflow: hidden;

      background: #111;
    }

    .book-cover img {
      height: 100%;

      transition:
        transform .8s ease;
    }

    .book-card:hover
    .book-cover img {
      transform: scale(1.035);
    }

    .book-info {
      padding: 19px;
    }

    .book-number {
      color: var(--gold);

      font-size: .64rem;

      font-weight: 700;

      letter-spacing: .2em;

      text-transform: uppercase;
    }

    .book-info h3 {
      font-size: 1.45rem;

      margin:
        8px
        0
        2px;
    }

    .book-original {
      color: #8f97a2;

      font-size: .77rem;

      margin-bottom: 11px;
    }

    .book-couple {
      color: #e9e6df;

      font-size: .83rem;

      font-weight: 600;

      margin-bottom: 10px;
    }

    .book-info p {
      color: #979faa;

      font-size: .78rem;

      margin: 0;

      line-height: 1.55;
    }

    /* =========================================================
       PERSONAGENS
    ========================================================= */

    .characters {
      background:
        radial-gradient(
          circle at 100% 0,
          rgba(91,24,39,.12),
          transparent 35%
        );
    }

    .character-grid {
      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 18px;
    }

    .character {
      position: relative;

      min-height: 420px;

      border-radius: 20px;

      overflow: hidden;

      border:
        1px solid
        var(--line);

      background: #0d1016;

      box-shadow:
        0 18px 55px
        rgba(0,0,0,.25);
    }

    .character-photo {
      height: 100%;

      min-height: 420px;

      position: absolute;

      inset: 0;
    }

    .character-photo img {
      height: 100%;

      filter:
        saturate(.82)
        contrast(1.03);

      transition:
        transform 1s ease;
    }

    .character:hover img {
      transform: scale(1.045);
    }

    .character-photo::after {
      content: "";

      position: absolute;

      inset: 0;

      background:
        linear-gradient(
          0deg,
          rgba(3,5,9,.98) 3%,
          rgba(3,5,9,.55) 45%,
          rgba(3,5,9,.05) 80%
        );
    }

    .character-text {
      position: absolute;

      inset:
        auto
        20px
        20px;

      z-index: 2;
    }

    .character-book {
      color: var(--gold);

      text-transform: uppercase;

      font-size: .61rem;

      font-weight: 700;

      letter-spacing: .16em;
    }

    .character h3 {
      font-size: 1.75rem;

      margin:
        5px
        0
        7px;
    }

    .character p {
      margin: 0;

      color: #c1c5cc;

      font-size: .8rem;

      line-height: 1.5;
    }

    /* =========================================================
       ADAPTAÇÃO
    ========================================================= */

    .adaptation {
      position: relative;

      overflow: hidden;

      padding:
        125px
        0;

      background:
        linear-gradient(
          90deg,
          rgba(5,7,12,.98) 0%,
          rgba(5,7,12,.82) 42%,
          rgba(5,7,12,.26) 100%
        ),
        linear-gradient(
          0deg,
          rgba(5,7,12,.95),
          rgba(5,7,12,.2)
        ),
        url("https://imgix.bustle.com/uploads/image/2026/5/13/6d9bb46c/off-campus6-51326-f5bfaa6e4c5e43f698d1141e7d4b9d2a.jpg?crop=focalpoint&fit=crop&fm=jpg&fp-x=0.5114&fp-y=0.2584&h=1200&w=1200")
        center/cover;
    }

    .adaptation-inner {
      width:
        min(
          1240px,
          calc(100% - 48px)
        );

      margin: auto;

      position: relative;

      z-index: 2;
    }

    .adaptation-copy {
      max-width: 690px;
    }

    .adaptation-copy p {
      color: #c3c7cf;

      margin:
        24px
        0
        0;

      font-size: 1rem;
    }

    .facts {
      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 12px;

      margin-top: 40px;

      max-width: 860px;
    }

    .fact {
      padding: 18px;

      background:
        rgba(255,255,255,.055);

      border:
        1px solid
        rgba(255,255,255,.09);

      backdrop-filter: blur(8px);

      border-radius: 14px;
    }

    .fact span {
      display: block;

      color: var(--gold);

      font-size: .6rem;

      letter-spacing: .18em;

      text-transform: uppercase;

      font-weight: 700;

      margin-bottom: 5px;
    }

    .fact strong {
      font-size: .88rem;
    }

    /* =========================================================
       ELENCO
    ========================================================= */

    .cast-grid {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 20px;
    }

    .cast-card {
      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.055),
          rgba(255,255,255,.018)
        );

      border:
        1px solid
        var(--line);

      border-radius: 20px;

      overflow: hidden;

      box-shadow:
        0 18px 50px
        rgba(0,0,0,.22);
    }

    .cast-photo {
      aspect-ratio: 4 / 4.5;

      overflow: hidden;

      background:
        linear-gradient(
          145deg,
          #16283f,
          #24101a
        );
    }

    .cast-photo img {
      height: 100%;

      transition:
        transform .8s ease;
    }

    .cast-card:hover img {
      transform: scale(1.04);
    }

    .cast-info {
      padding: 20px;
    }

    .cast-actor {
      color: #d9dce1;

      font-size: .9rem;

      font-weight: 600;
    }

    .cast-role {
      font-family:
        "Playfair Display",
        Georgia,
        serif;

      color: white;

      font-size: 1.55rem;

      margin:
        2px
        0
        8px;
    }

    .cast-info p {
      margin: 0;

      color: #959da8;

      font-size: .8rem;
    }

    .cast-note {
      color: var(--gold);

      font-size: .68rem;

      text-transform: uppercase;

      letter-spacing: .16em;

      margin-top: 13px;
    }

    /* =========================================================
       COMPARAÇÃO
    ========================================================= */

    .comparison {
      background:
        linear-gradient(
          90deg,
          rgba(13,26,44,.55),
          rgba(55,12,25,.35)
        );

      border-top:
        1px solid
        var(--line);

      border-bottom:
        1px solid
        var(--line);
    }

    .comparison-grid {
      display: grid;

      grid-template-columns:
        1fr
        1fr;

      gap: 1px;

      background: var(--line);

      border:
        1px solid
        var(--line);

      border-radius: 24px;

      overflow: hidden;
    }

    .compare-panel {
      padding: 48px;

      background:
        rgba(8,12,20,.93);
    }

    .compare-panel:last-child {
      background:
        linear-gradient(
          145deg,
          rgba(91,24,39,.20),
          rgba(8,12,20,.96)
        );
    }

    .compare-label {
      display: flex;

      align-items: center;

      gap: 13px;

      color: var(--gold);

      font-size: .7rem;

      letter-spacing: .22em;

      text-transform: uppercase;

      font-weight: 700;

      margin-bottom: 22px;
    }

    .compare-label::before {
      content: "";

      width: 28px;
      height: 1px;

      background: currentColor;
    }

    .compare-panel h3 {
      font-size: 2.5rem;

      margin-bottom: 23px;
    }

    .compare-list {
      display: grid;

      gap: 14px;

      margin: 0;

      padding: 0;

      list-style: none;
    }

    .compare-list li {
      color: #b6bcc5;

      padding-left: 21px;

      position: relative;

      font-size: .92rem;
    }

    .compare-list li::before {
      content: "•";

      position: absolute;

      left: 0;

      color: var(--wine-bright);
    }

    /* =========================================================
       UNIVERSO
    ========================================================= */

    .universe-grid {
      display: grid;

      grid-template-columns:
        repeat(6, 1fr);

      gap: 14px;
    }

    .universe-item {
      min-height: 245px;

      padding: 23px 18px;

      display: flex;

      flex-direction: column;

      justify-content: flex-end;

      position: relative;

      overflow: hidden;

      border-radius: 18px;

      border:
        1px solid
        var(--line);

      background:
        linear-gradient(
          0deg,
          rgba(4,6,11,.96),
          rgba(4,6,11,.05)
        ),
        var(--u-bg);

      background-size: cover;

      background-position: center;
    }

    .universe-symbol {
      position: absolute;

      top: 20px;
      right: 18px;

      font-size: 2rem;

      filter: grayscale(.1);

      opacity: .9;
    }

    .universe-item h3 {
      font-size: 1.55rem;

      margin-bottom: 5px;
    }

    .universe-item p {
      margin: 0;

      color: #9ea6b1;

      font-size: .74rem;

      line-height: 1.5;
    }

    /* =========================================================
       GALERIA
    ========================================================= */

    .gallery {
      background:
        radial-gradient(
          circle at 20% 10%,
          rgba(23,60,104,.13),
          transparent 28%
        ),
        radial-gradient(
          circle at 80% 70%,
          rgba(91,24,39,.13),
          transparent 30%
        );
    }

    .gallery-grid {
      display: grid;

      grid-template-columns:
        repeat(12, 1fr);

      grid-auto-rows: 145px;

      gap: 12px;
    }

    .gallery-item {
      position: relative;

      overflow: hidden;

      border-radius: 15px;

      border:
        1px solid
        rgba(255,255,255,.08);

      background: #0c1018;
    }

    .gallery-item img {
      height: 100%;

      transition:
        transform 1.2s ease,
        filter .8s ease;

      filter: saturate(.8);
    }

    .gallery-item:hover img {
      transform: scale(1.05);

      filter: saturate(1);
    }

    .gallery-item::after {
      content: "";

      position: absolute;

      inset: 0;

      background:
        linear-gradient(
          180deg,
          transparent 55%,
          rgba(0,0,0,.35)
        );

      pointer-events: none;
    }

    .g1 {
      grid-column: span 5;
      grid-row: span 3;
    }

    .g2 {
      grid-column: span 3;
      grid-row: span 2;
    }

    .g3 {
      grid-column: span 4;
      grid-row: span 2;
    }

    .g4 {
      grid-column: span 4;
      grid-row: span 3;
    }

    .g5 {
      grid-column: span 3;
      grid-row: span 2;
    }

    .g6 {
      grid-column: span 5;
      grid-row: span 2;
    }

    .g7 {
      grid-column: span 4;
      grid-row: span 2;
    }

    .g8 {
      grid-column: span 4;
      grid-row: span 2;
    }

    /* =========================================================
       FOOTER
    ========================================================= */

    footer {
      border-top:
        1px solid
        var(--line);

      padding:
        70px
        24px
        55px;

      text-align: center;

      background: #030509;
    }

    footer .brand {
      font-family:
        "Playfair Display",
        Georgia,
        serif;

      font-size: 2.3rem;

      letter-spacing: .08em;
    }

    footer p {
      max-width: 540px;

      margin:
        13px
        auto
        0;

      color: #8e96a2;

      font-size: .85rem;
    }

    footer small {
      display: block;

      color: #59616c;

      margin-top: 27px;

      font-size: .7rem;

      letter-spacing: .08em;
    }

    /* =========================================================
       ANIMAÇÕES
    ========================================================= */

    .reveal {

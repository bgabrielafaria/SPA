<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Um site de fã cinematográfico e informativo sobre Off-Campus, os livros de Elle Kennedy e sua adaptação para televisão.">
  <title>OFF-CAMPUS — Entre o amor e o gelo</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700;800&display=swap');

    :root {
      --bg: #05070c;
      --bg-2: #08111d;
      --navy: #0b1830;
      --blue: #173c68;
      --blue-bright: #2d628f;
      --wine: #5b1827;
      --wine-bright: #8c2b3d;
      --gold: #c7a76a;
      --cream: #eee9df;
      --white: #f7f7f5;
      --muted: #a8afb9;
      --line: rgba(255,255,255,.10);
      --shadow: 0 25px 80px rgba(0,0,0,.42);
      --radius: 22px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background:
        radial-gradient(circle at 15% 20%, rgba(23,60,104,.16), transparent 28%),
        radial-gradient(circle at 85% 50%, rgba(91,24,39,.13), transparent 30%),
        var(--bg);
      color: var(--white);
      font-family: "DM Sans", system-ui, sans-serif;
      line-height: 1.65;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 50;
      background-image:
        linear-gradient(rgba(255,255,255,.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.015) 1px, transparent 1px);
      background-size: 80px 80px;
      mask-image: linear-gradient(to bottom, black, transparent 90%);
    }

    img {
      display: block;
      width: 100%;
      max-width: 100%;
      object-fit: cover;
    }

    .section {
      position: relative;
      width: min(1240px, calc(100% - 48px));
      margin: 0 auto;
      padding: 110px 0;
    }

    .eyebrow {
      color: var(--gold);
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .24em;
      text-transform: uppercase;
      margin-bottom: 15px;
    }

    h1, h2, h3, .display {
      font-family: "Playfair Display", Georgia, serif;
      line-height: 1.04;
      margin: 0;
    }

    h2 {
      font-size: clamp(2.4rem, 5vw, 4.8rem);
      max-width: 820px;
    }

    .section-heading {
      margin-bottom: 55px;
    }

    .section-heading p {
      color: var(--muted);
      max-width: 680px;
      margin: 22px 0 0;
      font-size: 1.04rem;
    }

    /* HERO */

    .hero {
      min-height: 100svh;
      position: relative;
      display: flex;
      align-items: flex-end;
      isolation: isolate;
      background:
        linear-gradient(
          90deg,
          rgba(3,5,9,.96) 0%,
          rgba(3,5,9,.72) 35%,
          rgba(3,5,9,.18) 72%,
          rgba(3,5,9,.58) 100%
        ),
        linear-gradient(
          0deg,
          rgba(3,5,9,1) 0%,
          rgba(3,5,9,.12) 46%,
          rgba(3,5,9,.35) 100%
        ),
        url("https://static.independent.co.uk/2026/05/13/17/_Off_Campus__Portrait_Session_12445.jpg?fit=crop&height=1200&width=1200")
        center/cover;
      overflow: hidden;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(
          circle at 72% 30%,
          rgba(41,83,126,.20),
          transparent 28%
        ),
        linear-gradient(
          135deg,
          transparent 55%,
          rgba(110,22,44,.18)
        );
      z-index: -1;
      animation: atmosphere 9s ease-in-out infinite alternate;
    }

    .hero-content {
      width: min(1240px, calc(100% - 48px));
      margin: 0 auto;
      padding: 0 0 12vh;
      position: relative;
      z-index: 2;
    }

    .hero-kicker {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: #ddd6c7;
      font-size: .78rem;
      letter-spacing: .28em;
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 22px;
    }

    .hero-kicker::before {
      content: "";
      width: 38px;
      height: 1px;
      background: var(--gold);
    }

    .hero h1 {
      font-size: clamp(4.8rem, 13vw, 11.5rem);
      letter-spacing: -.055em;
      max-width: 1000px;
      text-shadow: 0 15px 50px rgba(0,0,0,.45);
    }

    .hero-tagline {
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(1.25rem, 2.2vw, 2rem);
      color: #f1eee9;
      max-width: 700px;
      margin: 22px 0 18px;
    }

    .hero-copy {
      max-width: 670px;
      color: #c7cbd1;
      font-size: 1rem;
    }

    .scroll-mark {
      position: absolute;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      width: 1px;
      height: 65px;
      background: linear-gradient(to bottom, transparent, var(--gold));
      opacity: .8;
      animation: breathe 2.2s ease-in-out infinite;
    }

    .scroll-mark::after {
      content: "EXPLORE";
      position: absolute;
      bottom: -4px;
      left: 50%;
      transform: translate(-50%, 100%) rotate(-90deg);
      transform-origin: center;
      color: #aaa;
      font-size: .55rem;
      letter-spacing: .28em;
      white-space: nowrap;
    }

    /* SOBRE */

    .about-grid {
      display: grid;
      grid-template-columns: 1.05fr .95fr;
      gap: 70px;
      align-items: center;
    }

    .about-copy {
      color: #c0c5cd;
      font-size: 1.02rem;
    }

    .about-copy p {
      margin: 0 0 20px;
    }

    .about-art {
      position: relative;
      min-height: 570px;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: var(--shadow);
      background:
        linear-gradient(180deg, transparent, rgba(0,0,0,.8)),
        url("https://media-assets.vanityfair.it/photos/6a7dd5e64dfe6a3f5abfd3cf/master/w_3940%2Cc_limit/Prime%2520Video_Off%2520Campus_7.jpg")
        center/cover;
    }

    .about-art::before {
      content: "BRIAR UNIVERSITY";
      position: absolute;
      left: 26px;
      bottom: 25px;
      color: rgba(255,255,255,.86);
      font-family: "Playfair Display", Georgia, serif;
      font-size: 1.7rem;
      letter-spacing: .08em;
    }

    .about-art::after {
      content: "";
      position: absolute;
      inset: 0;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: inherit;
    }

    /* LIVROS */

    .books {
      background:
        linear-gradient(
          180deg,
          transparent,
          rgba(23,60,104,.06),
          transparent
        );
    }

    .book-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 18px;
    }

    .book-card {
      position: relative;
      overflow: hidden;
      background: #0b0e15;
      border: 1px solid var(--line);
      border-radius: 18px;
      min-width: 0;
      box-shadow: 0 18px 45px rgba(0,0,0,.22);
      transition:
        transform .5s ease,
        border-color .5s ease,
        box-shadow .5s ease;
    }

    .book-card:hover {
      transform: translateY(-7px);
      border-color: rgba(199,167,106,.38);
      box-shadow: 0 28px 65px rgba(0,0,0,.35);
    }

    .book-cover {
      aspect-ratio: 2 / 3;
      overflow: hidden;
      background: #111;
    }

    .book-cover img {
      height: 100%;
      transition: transform .8s ease;
    }

    .book-card:hover .book-cover img {
      transform: scale(1.035);
    }

    .book-info {
      padding: 19px;
    }

    .book-number {
      color: var(--gold);
      font-size: .64rem;
      font-weight: 700;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .book-info h3 {
      font-size: 1.45rem;
      margin: 8px 0 2px;
    }

    .book-original {
      color: #8f97a2;
      font-size: .77rem;
      margin-bottom: 11px;
    }

    .book-couple {
      color: #e9e6df;
      font-size: .83rem;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .book-info p {
      color: #979faa;
      font-size: .78rem;
      margin: 0;
      line-height: 1.55;
    }

    /* PERSONAGENS */

    .characters {
      background:
        radial-gradient(
          circle at 100% 0,
          rgba(91,24,39,.12),
          transparent 35%
        );
    }

    .character-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .character {
      position: relative;
      min-height: 420px;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: #0d1016;
      box-shadow: 0 18px 55px rgba(0,0,0,.25);
    }

    .character-photo {
      height: 100%;
      min-height: 420px;
      position: absolute;
      inset: 0;
    }

    .character-photo img {
      height: 100%;
      filter: saturate(.82) contrast(1.03);
      transition: transform 1s ease;
    }

    .character:hover img {
      transform: scale(1.045);
    }

    .character-photo::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          0deg,
          rgba(3,5,9,.98) 3%,
          rgba(3,5,9,.55) 45%,
          rgba(3,5,9,.05) 80%
        );
    }

    .character-text {
      position: absolute;
      inset: auto 20px 20px;
      z-index: 2;
    }

    .character-book {
      color: var(--gold);
      text-transform: uppercase;
      font-size: .61rem;
      font-weight: 700;
      letter-spacing: .16em;
    }

    .character h3 {
      font-size: 1.75rem;
      margin: 5px 0 7px;
    }

    .character p {
      margin: 0;
      color: #c1c5cc;
      font-size: .8rem;
      line-height: 1.5;
    }

    /* ADAPTAÇÃO */

    .adaptation {
      position: relative;
      overflow: hidden;
      padding: 125px 0;
      background:
        linear-gradient(
          90deg,
          rgba(5,7,12,.98) 0%,
          rgba(5,7,12,.82) 42%,
          rgba(5,7,12,.26) 100%
        ),
        linear-gradient(
          0deg,
          rgba(5,7,12,.95),
          rgba(5,7,12,.2)
        ),
        url("https://imgix.bustle.com/uploads/image/2026/5/13/6d9bb46c/off-campus6-51326-f5bfaa6e4c5e43f698d1141e7d4b9d2a.jpg?crop=focalpoint&fit=crop&fm=jpg&fp-x=0.5114&fp-y=0.2584&h=1200&w=1200")
        center/cover;
    }

    .adaptation-inner {
      width: min(1240px, calc(100% - 48px));
      margin: auto;
      position: relative;
      z-index: 2;
    }

    .adaptation-copy {
      max-width: 690px;
    }

    .adaptation-copy p {
      color: #c3c7cf;
      font-size: 1rem;
    }

    .adaptation-facts {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-top: 40px;
      max-width: 820px;
    }

    .fact {
      padding: 20px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 16px;
      background: rgba(8,11,17,.56);
      backdrop-filter: blur(10px);
    }

    .fact strong {
      display: block;
      font-family: "Playfair Display", Georgia, serif;
      font-size: 1.4rem;
      margin-bottom: 6px;
    }

    .fact span {
      color: #9fa7b1;
      font-size: .75rem;
    }

    /* ELENCO */

    .cast-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .cast-card {
      background: #0b0e15;
      border: 1px solid var(--line);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,.22);
    }

    .cast-photo {
      aspect-ratio: 4 / 4.7;
      overflow: hidden;
      background: #111;
    }

    .cast-photo img {
      height: 100%;
      transition: transform .8s ease;
    }

    .cast-card:hover .cast-photo img {
      transform: scale(1.04);
    }

    .cast-info {
      padding: 21px;
    }

    .cast-actor {
      font-family: "Playfair Display", Georgia, serif;
      font-size: 1.35rem;
    }

    .cast-role {
      color: var(--gold);
      font-size: .78rem;
      font-weight: 700;
      margin-top: 4px;
    }

    .cast-info p {
      color: #9ca4af;
      font-size: .8rem;
      margin: 12px 0 0;
    }

    .cast-note {
      margin-top: 14px;
      color: #6f7783;
      font-size: .66rem;
      text-transform: uppercase;
      letter-spacing: .14em;
    }

    /* COMPARAÇÃO */

    .comparison {
      background:
        linear-gradient(
          135deg,
          rgba(23,60,104,.09),
          rgba(91,24,39,.08)
        );
      border-top: 1px solid rgba(255,255,255,.04);
      border-bottom: 1px solid rgba(255,255,255,.04);
    }

    .comparison-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .compare-panel {
      padding: 35px;
      min-height: 430px;
      border-radius: 24px;
      border: 1px solid var(--line);
      background: rgba(10,13,20,.76);
    }

    .compare-panel:nth-child(2) {
      background:
        linear-gradient(
          145deg,
          rgba(91,24,39,.18),
          rgba(10,13,20,.82)
        );
    }

    .compare-label {
      color: var(--gold);
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: .2em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .compare-panel h3 {
      font-size: 2.2rem;
      margin-bottom: 25px;
    }

    .compare-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .compare-list li {
      color: #aeb5be;
      padding: 12px 0 12px 25px;
      border-top: 1px solid rgba(255,255,255,.07);
      position: relative;
      font-size: .88rem;
    }

    .compare-list li::before {
      content: "•";
      position: absolute;
      left: 4px;
      color: var(--gold);
    }

    /* UNIVERSO */

    .universe-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .universe-item {
      min-height: 280px;
      position: relative;
      padding: 30px;
      border-radius: 22px;
      overflow: hidden;
      border: 1px solid var(--line);
      isolation: isolate;
      background: #0b0e15;
    }

    .universe-item::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          0deg,
          rgba(3,5,9,.98),
          rgba(3,5,9,.45)
        ),
        var(--u-bg) center/cover;
      z-index: -2;
      transition: transform .9s ease;
    }

    .universe-item:hover::before {
      transform: scale(1.06);
    }

    .universe-symbol {
      font-size: 2rem;
      margin-bottom: 70px;
      filter: grayscale(.2);
    }

    .universe-item h3 {
      font-size: 1.65rem;
      margin-bottom: 8px;
    }

    .universe-item p {
      color: #aeb5be;
      font-size: .8rem;
      margin: 0;
    }

    /* GALERIA */

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      grid-auto-rows: 95px;
      gap: 14px;
    }

    .gallery-item {
      position: relative;
      overflow: hidden;
      border-radius: 18px;
      border: 1px solid var(--line);
      background: #10131a;
    }

    .gallery-item img {
      height: 100%;
      transition: transform 1s ease;
    }

    .gallery-item:hover img {
      transform: scale(1.05);
    }

    .g1 {
      grid-column: span 5;
      grid-row: span 5;
    }

    .g2 {
      grid-column: span 3;
      grid-row: span 4;
    }

    .g3 {
      grid-column: span 4;
      grid-row: span 3;
    }

    .g4 {
      grid-column: span 3;
      grid-row: span 4;
    }

    .g5 {
      grid-column: span 4;
      grid-row: span 4;
    }

    .g6 {
      grid-column: span 5;
      grid-row: span 3;
    }

    .g7 {
      grid-column: span 3;
      grid-row: span 4;
    }

    .g8 {
      grid-column: span 4;
      grid-row: span 4;
    }

    /* FOOTER */

    footer {
      padding: 80px 24px 55px;
      text-align: center;
      border-top: 1px solid rgba(255,255,255,.08);
      background:
        radial-gradient(
          circle at center top,
          rgba(23,60,104,.14),
          transparent 45%
        ),
        #030509;
    }

    footer .brand {
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(3rem, 8vw, 7rem);
      letter-spacing: -.04em;
    }

    footer p {
      color: #9098a4;
      max-width: 600px;
      margin: 15px auto 8px;
    }

    footer small {
      color: #5e6672;
      font-size: .68rem;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    /* ANIMAÇÕES */

    .reveal {
      opacity: 1;
      transform: none;
      transition: opacity .9s ease, transform .9s ease;
    }

    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    @keyframes atmosphere {
      from {
        transform: scale(1);
      }

      to {
        transform: scale(1.045);
      }
    }

    @keyframes breathe {
      0%, 100% {
        opacity: .35;
        height: 50px;
      }

      50% {
        opacity: .9;
        height: 68px;
      }
    }

    /* RESPONSIVO */

    @media (max-width: 1050px) {
      .book-grid {
        grid-template-columns: repeat(3, 1fr);
      }

      .character-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .about-grid {
        gap: 40px;
      }
    }

    @media (max-width: 800px) {
      .section {
        width: min(100% - 30px, 650px);
        padding: 80px 0;
      }

      .hero-content {
        width: min(100% - 30px, 650px);
        padding-bottom: 15vh;
      }

      .hero h1 {
        font-size: clamp(4rem, 19vw, 7rem);
      }

      .about-grid,
      .comparison-grid {
        grid-template-columns: 1fr;
      }

      .about-art {
        min-height: 420px;
      }

      .adaptation {
        padding: 90px 0;
      }

      .adaptation-inner {
        width: min(100% - 30px, 650px);
      }

      .adaptation-facts {
        grid-template-columns: 1fr;
      }

      .cast-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .universe-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .gallery-grid {
        grid-auto-rows: 75px;
      }
    }

    @media (max-width: 560px) {
      .book-grid,
      .character-grid,
      .cast-grid,
      .universe-grid {
        grid-template-columns: 1fr;
      }

      .book-card {
        max-width: 330px;
        margin: 0 auto;
        width: 100%;
      }

      .character {
        min-height: 480px;
      }

      .character-photo {
        min-height: 480px;
      }

      .compare-panel {
        padding: 25px;
      }

      .gallery-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-auto-rows: 170px;
      }

      .g1,
      .g2,
      .g3,
      .g4,
      .g5,
      .g6,
      .g7,
      .g8 {
        grid-column: span 1;
        grid-row: span 1;
      }

      .g1,
      .g6 {
        grid-column: span 2;
      }

      footer .brand {
        font-size: 3.5rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }

      .reveal {
        opacity: 1;
        transform: none;
      }
    }
  </style>
</head>

<body>

  <!-- HERO -->

  <header class="hero">
    <div class="hero-content reveal">

      <div class="hero-kicker">
        BRIAR UNIVERSITY · OFF-CAMPUS
      </div>

      <h1>OFF-CAMPUS</h1>

      <div class="hero-tagline">
        Entre o amor, a amizade, o hóquei e a vida universitária.
      </div>

      <p class="hero-copy">
        Um universo criado por Elle Kennedy, onde amizades intensas,
        romances universitários e o mundo do hóquei se encontram em
        histórias conectadas — agora também adaptadas para as telas.
      </p>

    </div>

    <div class="scroll-mark"></div>
  </header>


  <main>

    <!-- SOBRE -->

    <section class="section reveal">

      <div class="about-grid">

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Um site de fã cinematográfico e informativo sobre Off-Campus, os livros de Elle Kennedy e sua adaptação para televisão.">
  <title>OFF-CAMPUS — Entre o amor e o gelo</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700;800&display=swap');

    :root {
      --bg: #05070c;
      --bg-2: #08111d;
      --navy: #0b1830;
      --blue: #173c68;
      --blue-bright: #2d628f;
      --wine: #5b1827;
      --wine-bright: #8c2b3d;
      --gold: #c7a76a;
      --cream: #eee9df;
      --white: #f7f7f5;
      --muted: #a8afb9;
      --line: rgba(255,255,255,.10);
      --shadow: 0 25px 80px rgba(0,0,0,.42);
      --radius: 22px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background:
        radial-gradient(circle at 15% 20%, rgba(23,60,104,.16), transparent 28%),
        radial-gradient(circle at 85% 50%, rgba(91,24,39,.13), transparent 30%),
        var(--bg);
      color: var(--white);
      font-family: "DM Sans", system-ui, sans-serif;
      line-height: 1.65;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 50;
      background-image:
        linear-gradient(rgba(255,255,255,.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.015) 1px, transparent 1px);
      background-size: 80px 80px;
      mask-image: linear-gradient(to bottom, black, transparent 90%);
    }

    img {
      display: block;
      width: 100%;
      max-width: 100%;
      object-fit: cover;
    }

    .section {
      position: relative;
      width: min(1240px, calc(100% - 48px));
      margin: 0 auto;
      padding: 110px 0;
    }

    .eyebrow {
      color: var(--gold);
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .24em;
      text-transform: uppercase;
      margin-bottom: 15px;
    }

    h1,
    h2,
    h3,
    .display {
      font-family: "Playfair Display", Georgia, serif;
      line-height: 1.04;
      margin: 0;
    }

    h2 {
      font-size: clamp(2.4rem, 5vw, 4.8rem);
      max-width: 820px;
    }

    .section-heading {
      margin-bottom: 55px;
    }

    .section-heading p {
      color: var(--muted);
      max-width: 680px;
      margin: 22px 0 0;
      font-size: 1.04rem;
    }

    /* HERO */

    .hero {
      min-height: 100svh;
      position: relative;
      display: flex;
      align-items: flex-end;
      isolation: isolate;

      background:
        linear-gradient(
          90deg,
          rgba(3,5,9,.96) 0%,
          rgba(3,5,9,.72) 35%,
          rgba(3,5,9,.18) 72%,
          rgba(3,5,9,.58) 100%
        ),
        linear-gradient(
          0deg,
          rgba(3,5,9,1) 0%,
          rgba(3,5,9,.12) 46%,
          rgba(3,5,9,.35) 100%
        ),
        url("https://static.independent.co.uk/2026/05/13/17/_Off_Campus__Portrait_Session_12445.jpg?fit=crop&height=1200&width=1200")
        center/cover;

      overflow: hidden;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;

      background:
        radial-gradient(
          circle at 72% 30%,
          rgba(41,83,126,.20),
          transparent 28%
        ),
        linear-gradient(
          135deg,
          transparent 55%,
          rgba(110,22,44,.18)
        );

      z-index: -1;
      animation: atmosphere 9s ease-in-out infinite alternate;
    }

    .hero-content {
      width: min(1240px, calc(100% - 48px));
      margin: 0 auto;
      padding: 0 0 12vh;
      position: relative;
      z-index: 2;
    }

    .hero-kicker {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: #ddd6c7;
      font-size: .78rem;
      letter-spacing: .28em;
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 22px;
    }

    .hero-kicker::before {
      content: "";
      width: 38px;
      height: 1px;
      background: var(--gold);
    }

    .hero h1 {
      font-size: clamp(4.8rem, 13vw, 11.5rem);
      letter-spacing: -.055em;
      max-width: 1000px;
      text-shadow: 0 15px 50px rgba(0,0,0,.45);
    }

    .hero-tagline {
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(1.25rem, 2.2vw, 2rem);
      color: #f1eee9;
      max-width: 700px;
      margin: 22px 0 18px;
    }

    .hero-copy {
      max-width: 670px;
      color: #c7cbd1;
      font-size: 1rem;
    }

    .scroll-mark {
      position: absolute;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      width: 1px;
      height: 65px;
      background: linear-gradient(to bottom, transparent, var(--gold));
      opacity: .8;
      animation: breathe 2.2s ease-in-out infinite;
    }

    .scroll-mark::after {
      content: "EXPLORE";
      position: absolute;
      bottom: -4px;
      left: 50%;
      transform: translate(-50%, 100%) rotate(-90deg);
      transform-origin: center;
      color: #aaa;
      font-size: .55rem;
      letter-spacing: .28em;
      white-space: nowrap;
    }

    /* SOBRE */

    .about-grid {
      display: grid;
      grid-template-columns: 1.05fr .95fr;
      gap: 70px;
      align-items: center;
    }

    .about-copy {
      color: #c0c5cd;
      font-size: 1.02rem;
    }

    .about-copy p {
      margin: 0 0 20px;
    }

    .about-art {
      position: relative;
      min-height: 570px;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: var(--shadow);

      background:
        linear-gradient(180deg, transparent, rgba(0,0,0,.8)),
        url("https://media-assets.vanityfair.it/photos/6a7dd5e64dfe6a3f5abfd3cf/master/w_3940%2Cc_limit/Prime%2520Video_Off%2520Campus_7.jpg")
        center/cover;
    }

    .about-art::before {
      content: "BRIAR UNIVERSITY";
      position: absolute;
      left: 26px;
      bottom: 25px;
      color: rgba(255,255,255,.86);
      font-family: "Playfair Display", Georgia, serif;
      font-size: 1.7rem;
      letter-spacing: .08em;
    }

    .about-art::after {
      content: "";
      position: absolute;
      inset: 0;
      border: 1px solid rgba(255,255,255,.10);
      border-radius: inherit;
    }

    /* LIVROS */

    .books {
      background:
        radial-gradient(
          circle at 15% 30%,
          rgba(23,60,104,.16),
          transparent 30%
        );
    }

    .book-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 18px;
    }

    .book-card {
      background:
        linear-gradient(
          180deg,
          rgba(255,255,255,.06),
          rgba(255,255,255,.025)
        );

      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,.22);
      transition:
        transform .5s ease,
        border-color .5s ease;
    }

    .book-card:hover {
      transform: translateY(-8px);
      border-color: rgba(199,167,106,.38);
    }

    .book-cover {
      aspect-ratio: 2 / 3;
      overflow: hidden;
      background: #111827;
    }

    .book-cover img {
      height: 100%;
      object-fit: cover;
      transition: transform .7s ease;
    }

    .book-card:hover .book-cover img {
      transform: scale(1.035);
    }

    .book-info {
      padding: 19px;
    }

    .book-number {
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: .17em;
      font-size: .63rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .book-info h3 {
      font-size: 1.45rem;
      margin-bottom: 3px;
    }

    .book-original {
      color: #9fa7b3;
      font-size: .78rem;
      font-style: italic;
      margin-bottom: 10px;
    }

    .book-couple {
      color: #e3e0db;
      font-size: .78rem;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .book-info p {
      color: #9ea6b1;
      font-size: .77rem;
      margin: 0;
    }

    /* PERSONAGENS */

    .characters {
      background:
        linear-gradient(
          180deg,
          transparent,
          rgba(91,24,39,.06),
          transparent
        );
    }

    .character-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .character {
      min-height: 490px;
      position: relative;
      overflow: hidden;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background: #0a0e17;
    }

    .character-photo {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .character-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .7s ease;
    }

    .character:hover img {
      transform: scale(1.045);
    }

    .character-photo::after {
      content: "";
      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          180deg,
          rgba(3,5,9,.02) 20%,
          rgba(3,5,9,.28) 50%,
          rgba(3,5,9,.96) 100%
        );
    }

    .character-text {
      position: absolute;
      left: 19px;
      right: 19px;
      bottom: 18px;
      z-index: 2;
    }

    .character-book {
      color: var(--gold);
      text-transform: uppercase;
      font-size: .62rem;
      letter-spacing: .17em;
      font-weight: 700;
      margin-bottom: 7px;
    }

    .character h3 {
      font-size: 1.55rem;
      margin-bottom: 6px;
    }

    .character p {
      margin: 0;
      color: #c1c6ce;
      font-size: .77rem;
      line-height: 1.5;
    }

    /* ADAPTAÇÃO */

    .adaptation {
      position: relative;
      padding: 125px 0;
      overflow: hidden;

      background:
        linear-gradient(
          90deg,
          rgba(5,7,12,.97),
          rgba(5,7,12,.77),
          rgba(5,7,12,.92)
        ),
        url("https://media-assets.vanityfair.it/photos/6a7dd5e64dfe6a3f5abfd3cf/master/w_3940%2Cc_limit/Prime%2520Video_Off%2520Campus_7.jpg")
        center/cover fixed;
    }

    .adaptation-inner {
      width: min(1240px, calc(100% - 48px));
      margin: 0 auto;

      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 70px;
      align-items: center;
    }

    .adaptation-copy {
      max-width: 680px;
    }

    .adaptation-copy p {
      color: #c1c6ce;
      font-size: 1rem;
      margin: 20px 0 0;
    }

    .adaptation-facts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .fact {
      padding: 25px;
      border-radius: 20px;
      background: rgba(255,255,255,.055);
      border: 1px solid rgba(255,255,255,.10);
      backdrop-filter: blur(10px);
    }

    .fact strong {
      display: block;
      font-family: "Playfair Display", serif;
      font-size: 1.35rem;
      margin-bottom: 5px;
    }

    .fact span {
      color: #9fa7b3;
      font-size: .76rem;
    }

    /* ELENCO */

    .cast-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .cast-card {
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--line);
      background: #0a0e17;
    }

    .cast-photo {
      aspect-ratio: 4 / 5;
      overflow: hidden;
    }

    .cast-photo img {
      height: 100%;
      object-fit: cover;
      transition: transform .7s ease;
    }

    .cast-card:hover .cast-photo img {
      transform: scale(1.035);
    }

    .cast-info {
      padding: 20px;
    }

    .cast-actor {
      color: var(--gold);
      font-size: .65rem;
      letter-spacing: .16em;
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 7px;
    }

    .cast-info h3 {
      font-size: 1.45rem;
      margin-bottom: 7px;
    }

    .cast-info p {
      color: #9ea6b1;
      font-size: .78rem;
      margin: 0;
    }

    /* COMPARAÇÃO */

    .comparison {
      padding-bottom: 120px;
    }

    .comparison-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: var(--line);
      border: 1px solid var(--line);
      border-radius: 28px;
      overflow: hidden;
    }

    .comparison-side {
      padding: 42px;
      background:
        linear-gradient(
          135deg,
          rgba(23,60,104,.14),
          rgba(255,255,255,.025)
        );
    }

    .comparison-side:last-child {
      background:
        linear-gradient(
          135deg,
          rgba(91,24,39,.14),
          rgba(255,255,255,.025)
        );
    }

    .comparison-side h3 {
      font-size: 2.1rem;
      margin-bottom: 15px;
    }

    .comparison-side p {
      color: #aeb4bd;
      margin: 0 0 25px;
    }

    .comparison-list {
      display: grid;
      gap: 14px;
    }

    .comparison-item {
      padding: 16px;
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 16px;
      background: rgba(255,255,255,.025);
    }

    .comparison-item strong {
      display: block;
      margin-bottom: 4px;
      color: #f1eee9;
    }

    .comparison-item span {
      color: #949da9;
      font-size: .8rem;
    }

    /* UNIVERSO */

    .universe-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .universe-card {
      position: relative;
      min-height: 330px;
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--line);
      background: #0a0e17;
    }

    .universe-card img {
      position: absolute;
      inset: 0;
      height: 100%;
      object-fit: cover;
      opacity: .75;
      transition: transform .8s ease;
    }

    .universe-card:hover img {
      transform: scale(1.04);
    }

    .universe-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          180deg,
          rgba(3,5,9,.05),
          rgba(3,5,9,.94)
        );
    }

    .universe-text {
      position: absolute;
      z-index: 2;
      left: 23px;
      right: 23px;
      bottom: 22px;
    }

    .universe-text h3 {
      font-size: 1.8rem;
      margin-bottom: 5px;
    }

    .universe-text p {
      color: #b9bec6;
      font-size: .78rem;
      margin: 0;
    }

    /* GALERIA */

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      grid-auto-rows: 180px;
      gap: 14px;
    }

    .gallery-item {
      overflow: hidden;
      border-radius: 18px;
      border: 1px solid var(--line);
      position: relative;
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .8s ease;
    }

    .gallery-item:hover img {
      transform: scale(1.045);
    }

    .gallery-item:nth-child(1) {
      grid-column: span 5;
      grid-row: span 2;
    }

    .gallery-item:nth-child(2) {
      grid-column: span 3;
      grid-row: span 2;
    }

    .gallery-item:nth-child(3) {
      grid-column: span 4;
    }

    .gallery-item:nth-child(4) {
      grid-column: span 4;
    }

    .gallery-item:nth-child(5) {
      grid-column: span 4;
    }

    .gallery-item:nth-child(6) {
      grid-column: span 4;
    }

    .gallery-item:nth-child(7) {
      grid-column: span 4;
    }

    .gallery-item:nth-child(8) {
      grid-column: span 4;
    }

    /* FOOTER */

    footer {
      padding: 90px 24px 45px;
      text-align: center;

      background:
        radial-gradient(
          circle at 50% 0,
          rgba(91,24,39,.18),
          transparent 38%
        ),
        #03050a;
    }

    .footer-logo {
      font-family: "Playfair Display", serif;
      font-size: clamp(3rem, 8vw, 6rem);
      letter-spacing: -.05em;
    }

    footer p {
      color: #8f98a4;
      max-width: 600px;
      margin: 18px auto;
    }

    .footer-small {
      margin-top: 45px;
      color: #666e78;
      font-size: .72rem;
    }

    /* ANIMAÇÕES */

    .reveal {
      opacity: 0;
      transform: translateY(35px);
      transition:
        opacity .9s ease,
        transform .9s ease;
    }

    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    @keyframes atmosphere {
      from {
        transform: scale(1);
        opacity: .7;
      }

      to {
        transform: scale(1.04);
        opacity: 1;
      }
    }

    @keyframes breathe {
      0%,
      100% {
        opacity: .35;
        height: 45px;
      }

      50% {
        opacity: 1;
        height: 70px;
      }
    }

    /* TABLET */

    @media (max-width: 1050px) {
      .book-grid {
        grid-template-columns: repeat(3, 1fr);
      }

      .character-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .cast-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .about-grid,
      .adaptation-inner {
        grid-template-columns: 1fr;
      }

      .about-art {
        min-height: 500px;
      }
    }

    /* MOBILE */

    @media (max-width: 700px) {
      .section {
        width: min(100% - 30px, 1240px);
        padding: 75px 0;
      }

      .hero-content {
        width: calc(100% - 30px);
        padding-bottom: 15vh;
      }

      .hero {
        min-height: 90svh;
      }

      .hero h1 {
        font-size: clamp(4rem, 20vw, 7rem);
      }

      .hero-tagline {
        font-size: 1.25rem;
      }

      .about-grid,
      .adaptation-inner,
      .comparison-grid {
        grid-template-columns: 1fr;
        gap: 30px;
      }

      .about-art {
        min-height: 420px;
      }

      .book-grid,
      .character-grid,
      .cast-grid,
      .universe-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .book-info {
        padding: 14px;
      }

      .book-info h3 {
        font-size: 1.15rem;
      }

      .book-info p {
        font-size: .72rem;
      }

      .character {
        min-height: 380px;
      }

      .character h3 {
        font-size: 1.3rem;
      }

      .character p {
        font-size: .68rem;
      }

      .adaptation {
        padding: 80px 0;
        background-attachment: scroll;
      }

      .adaptation-inner {
        width: calc(100% - 30px);
      }

      .adaptation-facts {
        grid-template-columns: 1fr 1fr;
      }

      .comparison-side {
        padding: 28px;
      }

      .gallery-grid {
        grid-template-columns: repeat(2, 1fr);
        grid-auto-rows: 160px;
      }

      .gallery-item:nth-child(n) {
        grid-column: span 1;
        grid-row: span 1;
      }

      .gallery-item:first-child {
        grid-column: span 2;
        grid-row: span 2;
      }

      footer {
        padding-top: 70px;
      }
    }

    @media (max-width: 470px) {
      .book-grid,
      .character-grid,
      .cast-grid,
      .universe-grid {
        grid-template-columns: 1fr;
      }

      .adaptation-facts {
        grid-template-columns: 1fr;
      }

      .character {
        min-height: 440px;
      }
    }
  </style>
</head>

<body>

  <!-- HERO -->

  <header class="hero">
    <div class="hero-content">
      <div class="hero-kicker">
        BRIAR UNIVERSITY
      </div>

      <h1>OFF-CAMPUS</h1>

      <div class="hero-tagline">
        Entre o amor, a amizade, o hóquei e a vida universitária.
      </div>

      <p class="hero-copy">
        Um universo criado por Elle Kennedy, onde amizades
